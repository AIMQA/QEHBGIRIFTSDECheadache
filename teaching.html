<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Headache in SDEC teaching deck</title>
<meta name="description" content="Narrated, interactive teaching deck on the QEHB SDEC headache pathway: red flags, imaging restraint, medication overuse and safe discharge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560;9..144,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed 1280 x 720 stage scaled to fit the window, one slide at a time, toolbar below, presenter notes drawer at the foot. Same palette as the pathway site. */
:root {
  --paper: #F7F4EE;
  --paper-2: #ECE6DA;
  --ink: #0B1F33;
  --ink-2: #4B5A69;
  --rule: #D8D1C3;
  --accent: #4F3A78;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8E2F0;
  --red: #A1231D;
  --red-soft: #F5E0DC;
  --amber: #82560A;
  --amber-soft: #F4E7CC;
  --green: #2C6E49;
  --green-soft: #DFECE3;
  --skin: #F1C9A5;
  --shadow: 0 18px 40px -24px rgba(11, 31, 51, 0.45);
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --body: "Inter Tight", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13202E; --paper-2: #0B141E; --ink: #ECE7DC; --ink-2: #A8B3BE; --rule: #2E3E50;
    --accent: #BCA7E2; --accent-ink: #1A1230; --accent-soft: #2A2340;
    --red: #F2A097; --red-soft: #3A1F1E; --amber: #E6BB66; --amber-soft: #33290F; --green: #8FCBA4; --green-soft: #183021;
    --skin: #D9A77E; --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13202E; --paper-2: #0B141E; --ink: #ECE7DC; --ink-2: #A8B3BE; --rule: #2E3E50;
  --accent: #BCA7E2; --accent-ink: #1A1230; --accent-soft: #2A2340;
  --red: #F2A097; --red-soft: #3A1F1E; --amber: #E6BB66; --amber-soft: #33290F; --green: #8FCBA4; --green-soft: #183021;
  --skin: #D9A77E; --shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper-2);
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

/* Progress */
.progress { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 4px; background: var(--rule); z-index: 20; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }

/* Stage */
.viewport { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; padding-block: 14px 8px; }
.stage-box { position: relative; }
.stage { width: 1280px; height: 720px; transform-origin: top left; position: absolute; top: 0; left: 0; background: var(--paper); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.slide { position: absolute; inset: 0; padding: 60px 72px 56px; display: none; }
.slide.active { display: block; }
.eyebrow { position: absolute; top: 28px; left: 72px; font-family: var(--mono); font-size: 15px; letter-spacing: .04em; color: var(--accent); }
.num { position: absolute; bottom: 22px; right: 72px; font-family: var(--mono); font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.slide h1 { font-family: var(--display); font-weight: 560; font-size: 54px; line-height: 1.04; letter-spacing: -0.015em; margin: 0 0 14px; text-wrap: balance; }
.slide h2 { font-family: var(--display); font-weight: 560; font-size: 42px; line-height: 1.08; letter-spacing: -0.012em; margin: 0 0 16px; text-wrap: balance; }
.slide h3 { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
.slide p { font-size: 23px; line-height: 1.45; margin: 0 0 12px; }
.slide .lede { font-size: 27px; color: var(--ink-2); max-width: 30ch; }
.slide ul { margin: 0; padding-left: 1.1em; font-size: 22px; line-height: 1.4; }
.slide li { margin: 0 0 8px; padding-left: 4px; }
.slide li::marker { color: var(--accent); }
.slide strong { font-weight: 700; }
.small { font-size: 17px !important; color: var(--ink-2); }
ol.steps { list-style: none; counter-reset: s; margin: 0 0 8px; padding: 0; display: grid; gap: 10px; font-size: 20px; line-height: 1.4; }
ol.steps > li { counter-increment: s; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; }
ol.steps > li::before { content: counter(s); font-family: var(--mono); font-size: 14px; font-weight: 500; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-top: 2px; }
.mono { font-family: var(--mono); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
.cols-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
.cols.art { grid-template-columns: 1.15fr 0.85fr; align-items: center; }
.center { text-align: center; }
.big { font-family: var(--display); font-weight: 700; font-size: 120px; line-height: 1; color: var(--accent); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 14px; letter-spacing: .02em; padding: 4px 11px; border-radius: 99px; border: 1px solid transparent; white-space: nowrap; }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.tag.emergency { color: var(--red); background: var(--red-soft); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
.tag.sameday { color: var(--amber); background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 30%, transparent); }
.tag.routine { color: var(--green); background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 30%, transparent); }
.hint { position: absolute; bottom: 22px; left: 72px; font-family: var(--mono); font-size: 14px; color: var(--ink-2); }
.hint::before { content: "↳ "; color: var(--accent); }

/* Fragments: build steps */
.f { opacity: 0; transform: translateY(14px); transition: opacity .45s ease, transform .45s ease; }
.f.on { opacity: 1; transform: none; }
.f.dim { opacity: .35; }

/* Panels and cards */
.panel { border: 1px solid var(--rule); border-radius: 10px; padding: 18px 22px; background: var(--paper); }
.panel.stop { background: var(--red-soft); border-color: color-mix(in srgb, var(--red) 35%, transparent); }
.panel.caution { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 35%, transparent); }
.panel.good { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.panel .lbl { font-family: var(--mono); font-size: 14px; letter-spacing: .03em; color: var(--ink-2); margin: 0 0 6px; }
.panel.stop .lbl { color: var(--red); }
.panel.caution .lbl { color: var(--amber); }
.panel.good .lbl { color: var(--green); }

/* Stage tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.tile { border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; background: var(--paper); }
.tile .sn { font-family: var(--mono); font-size: 14px; color: var(--accent); }
.tile b { display: block; font-size: 24px; margin: 4px 0 2px; }
.tile span { font-size: 18px; color: var(--ink-2); }

/* Flip cards */
.flips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.flips.four { grid-template-columns: repeat(4, 1fr); }
.flip { position: relative; min-height: 118px; perspective: 900px; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; font: inherit; color: inherit; }
.flip .in { position: absolute; inset: 0; transition: transform .5s; transform-style: preserve-3d; }
.flip.flipped .in { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px; border: 1px solid var(--rule); padding: 14px 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; background: var(--paper); }
.flip .face.back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); }
.flip .face b { font-size: 20px; line-height: 1.25; }
.flip .face span { font-size: 16px; color: var(--ink-2); line-height: 1.3; }
.flip .face.back span { color: var(--ink); }
.flip .face .tag { align-self: flex-start; margin-bottom: 2px; }

/* Quiz */
.quiz { display: grid; gap: 12px; }
.q { display: grid; grid-template-columns: 1fr auto; gap: 10px 18px; align-items: center; border: 1px solid var(--rule); border-radius: 10px; padding: 12px 16px; background: var(--paper); transition: background .25s, border-color .25s; }
.q .qt { font-size: 20px; line-height: 1.3; }
.q .ans { display: flex; gap: 8px; }
.q .fb { grid-column: 1 / -1; font-size: 17px; line-height: 1.35; color: var(--ink-2); display: none; }
.q.done .fb { display: block; }
.q.right { background: var(--green-soft); border-color: var(--green); }
.q.wrong { background: var(--red-soft); border-color: var(--red); }
.ob { font: 600 16px var(--body); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; }
.ob:hover { border-color: var(--accent); }
.ob.picked { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.q.done .ob { cursor: default; }

/* Hotspots */
.hotwrap { display: grid; grid-template-columns: 520px 1fr; gap: 36px; align-items: center; }
.hot { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); background: var(--paper); color: var(--accent); font: 600 18px var(--mono); cursor: pointer; display: grid; place-items: center; box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); animation: pulse 2.2s infinite; }
.hot.on { background: var(--accent); color: var(--accent-ink); animation: none; }
.hot.sm { width: 32px; height: 32px; font-size: 15px; border-width: 2px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70% { box-shadow: 0 0 0 14px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.hotpanel { min-height: 220px; }
.hotpanel h3 { font-size: 26px; }
.hotpanel p { font-size: 21px; }

/* Dots crowd */
.dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 8px; width: 560px; }
.dots i { display: block; aspect-ratio: 1; border-radius: 50%; background: var(--accent-soft); border: 2px solid var(--accent-soft); opacity: 0; transform: scale(.4); }
.slide.active .dots i { animation: pop .35s ease forwards; animation-delay: calc(var(--i) * 10ms); }
.dots i.sec { background: var(--red-soft); border-color: var(--red); }
@keyframes pop { to { opacity: 1; transform: scale(1); } }

/* Chart */
.chart { width: 100%; height: auto; }
.chart text { font-family: var(--mono); font-size: 15px; fill: var(--ink-2); }
.chart .axis { stroke: var(--rule); stroke-width: 2; }
.chart .line { fill: none; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 1400; stroke-dashoffset: 1400; transition: stroke-dashoffset 1.8s ease; }
.chart .line.mig { stroke: var(--accent); }
.chart .line.tc { stroke: var(--red); }
.chart .on .line { stroke-dashoffset: 0; }
.chart .thresh { stroke: var(--red); stroke-width: 2; stroke-dasharray: 6 6; }

/* Timeline */
.tl { position: relative; height: 150px; margin: 24px 0 8px; }
.tl .bar { position: absolute; left: 0; right: 0; top: 56px; height: 10px; background: var(--rule); border-radius: 5px; }
.tl .fill { position: absolute; left: 0; top: 56px; height: 10px; border-radius: 5px; background: var(--accent); width: 0; transition: width .8s ease; }
.tl .mk { position: absolute; top: 36px; width: 2px; transform: translateX(-50%); }
.tl .mk i { display: block; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); border: 4px solid var(--accent); margin: 0 0 0 -10px; }
.tl .mk.red i { border-color: var(--red); }
.tl .mk b { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--mono); font-size: 16px; color: var(--accent); }
.tl .mk.red b { color: var(--red); }
.tl .mk span { position: absolute; top: -34px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 17px; color: var(--ink-2); }

/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, 44px); gap: 8px; }
.cal i { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--rule); font: 500 15px var(--mono); color: var(--ink-2); background: var(--paper); }
.cal i.rx { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cal .dow { border: 0; background: none; font-size: 13px; }

/* Case walkthrough */
.case { display: grid; gap: 12px; }
.step { border: 1px solid var(--rule); border-radius: 10px; padding: 14px 18px; background: var(--paper); }
.step[hidden] { display: none; }
.step .st { font-size: 20px; line-height: 1.35; margin-bottom: 10px; }
.step .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.step .fb { margin-top: 10px; font-size: 17px; line-height: 1.35; display: none; padding: 8px 12px; border-radius: 8px; }
.step.done .fb { display: block; }
.step.right .fb { background: var(--green-soft); color: var(--green); }
.step.wrong .fb { background: var(--red-soft); color: var(--red); }

/* Illustrations */
.art svg { width: 100%; height: auto; display: block; }
.art .ink { stroke: var(--ink); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.art .fill-ink { fill: var(--ink); }
.art .fill-skin { fill: var(--skin); }
.art .fill-acc { fill: var(--accent); }
.art .fill-soft { fill: var(--accent-soft); }
.art .fill-red { fill: var(--red); }
.art .fill-paper { fill: var(--paper); }
.art .fill-rule { fill: var(--rule); }
.art .fill-amber { fill: var(--amber); }
.art .fill-amber-soft { fill: var(--amber-soft); }
.art .stroke-acc { stroke: var(--accent); fill: none; stroke-width: 3; stroke-linecap: round; }
.art .stroke-red { stroke: var(--red); fill: none; stroke-width: 3; stroke-linecap: round; }
.art text { font-family: var(--body); fill: var(--ink); }
.bolt { transform-origin: 50% 20%; animation: flash 1.6s ease-in-out infinite; }
@keyframes flash { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
.float { animation: float 4s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.tick { transform-origin: 220px 150px; animation: tick 2s linear infinite; }
@keyframes tick { to { transform: rotate(360deg); } }

/* Toolbar */
.bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 6px 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar .sp { flex: 1; }
.tb { appearance: none; -webkit-appearance: none; font: 600 15px var(--body); min-height: 40px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tb:hover { border-color: var(--accent); }
.tb.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tb.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tb:disabled { opacity: .45; cursor: default; }
.counter { font-family: var(--mono); font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding: 0 6px; }
.keys { font-family: var(--mono); font-size: 13px; color: var(--ink-2); }

/* Notes drawer */
.notes { flex: none; max-height: 34vh; overflow: auto; border-top: 1px solid var(--rule); background: var(--paper); margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.notes .nl { font-family: var(--mono); font-size: 13px; color: var(--accent); margin: 0 0 6px; }
.notes p { margin: 0; font-size: 17px; line-height: 1.5; max-width: 80ch; }
.notes .speaking { background: var(--accent-soft); }

@media (max-width: 700px) {
  .keys { display: none; }
  .bar .label { display: none; }
  .tb { padding: 8px 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .f { transform: none; }
  .dots i { opacity: 1; transform: none; }
  .chart .line { stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><i id="prog"></i></div>
<div class="viewport"><div class="stage-box" id="stage-box"><div class="stage" id="stage" aria-live="polite"></div></div></div>
<div class="bar">
  <button class="tb" id="b-prev" type="button" aria-label="Previous">←<span class="label"> Back</span></button>
  <span class="counter" id="counter">1 / 1</span>
  <button class="tb primary" id="b-next" type="button" aria-label="Next"><span class="label">Next </span>→</button>
  <span class="sp"></span>
  <button class="tb" id="b-notes" type="button" aria-pressed="false">Notes</button>
  <button class="tb" id="b-voice" type="button" aria-pressed="false">Narrate</button>
  <button class="tb" id="b-full" type="button">Full screen</button>
  <a class="tb" id="b-pathway" href="#" hidden>Pathway</a>
  <span class="keys">→ next · ← back · N notes · V narrate · F full screen</span>
</div>
<div class="notes" id="notes" hidden><p class="nl" id="notes-label">Narration</p><p id="notes-text"></p></div>

<script>
/* ============================================================
   Settings
   ============================================================ */
const LINKS = {
  pathway: "index.html"   // Link to the SDEC headache pathway ("index.html" when the deck is served beside it); shown on the last slide and in the toolbar when set
};

/* ============================================================
   Illustrations (inline SVG, drawn in the deck palette)
   ============================================================ */
const ART = {
  // Head in profile, lightning bolt (secondary) and calm wave (primary)
  title: `<svg viewBox="0 0 420 360" role="img" aria-label="Cartoon head with a lightning bolt and a calm wave">
    <circle cx="210" cy="190" r="150" class="fill-soft"/>
    <path class="fill-skin" d="M150 110c20-50 60-70 110-62 54 9 86 50 86 104 0 34-14 54-30 72l10 48c2 10-6 18-16 16l-50-10c-12 14-30 22-52 22-54 0-82-40-82-96 0-36 10-72 24-94z"/>
    <path class="ink" d="M150 110c20-50 60-70 110-62 54 9 86 50 86 104 0 34-14 54-30 72l10 48c2 10-6 18-16 16l-50-10c-12 14-30 22-52 22-54 0-82-40-82-96 0-36 10-72 24-94z"/>
    <path class="fill-ink" d="M146 112c30-56 92-80 150-56-34 8-56 22-70 46-10 18-14 40-30 52-20 16-44 10-50-42z"/>
    <circle cx="300" cy="170" r="6" class="fill-ink"/>
    <path class="ink" d="M286 150c10-8 24-8 34-2"/>
    <path class="ink" d="M292 226c8 6 18 6 26 0"/>
    <g class="bolt"><path class="fill-red" d="M330 30l-30 60h30l-18 54 60-74h-32l22-40z"/></g>
    <path class="stroke-acc float" d="M40 300c20-24 40-24 60 0s40 24 60 0 40-24 60 0" stroke-width="5"/>
  </svg>`,
  // Clinician with stethoscope and clipboard
  clinician: `<svg viewBox="0 0 320 400" role="img" aria-label="Cartoon clinician holding a clipboard">
    <circle cx="160" cy="88" r="56" class="fill-skin"/><circle cx="160" cy="88" r="56" class="ink"/>
    <path class="fill-ink" d="M106 80c6-40 36-60 70-56 24 4 38 20 40 40-26-14-56-8-110 16z"/>
    <circle cx="142" cy="92" r="5" class="fill-ink"/><circle cx="178" cy="92" r="5" class="fill-ink"/>
    <path class="ink" d="M146 118c8 7 20 7 28 0"/>
    <path class="fill-paper" d="M70 390V210c0-40 36-70 90-70s90 30 90 70v180z"/>
    <path class="ink" d="M70 390V210c0-40 36-70 90-70s90 30 90 70v180"/>
    <path class="ink" d="M160 140v60"/>
    <path class="stroke-acc" d="M128 150c-10 40-6 80 20 100M192 150c10 40 6 80-20 100" stroke-width="4"/>
    <circle cx="150" cy="252" r="10" class="fill-acc"/>
    <rect x="178" y="236" width="76" height="98" rx="8" class="fill-amber-soft"/><rect x="178" y="236" width="76" height="98" rx="8" class="ink"/>
    <path class="ink" d="M192 262h48M192 282h48M192 302h30"/>
    <rect x="200" y="226" width="32" height="18" rx="4" class="fill-ink"/>
  </svg>`,
  // Front-facing face with hotspot anchor points

/* ============================================================
   Engine
   ============================================================ */
const stage = document.getElementById("stage");
const notesEl = document.getElementById("notes");
const notesText = document.getElementById("notes-text");
const STATE = { i: 0, step: 0 };

SLIDES.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide";
  el.id = "s" + (i + 1);
  el.setAttribute("aria-label", "Slide " + (i + 1));
  el.innerHTML = '<p class="eyebrow">' + esc(s.eyebrow) + "</p>" + s.html + '<p class="num">' + (i + 1) + " / " + SLIDES.length + "</p>";
  stage.appendChild(el);
});
const slides = [...stage.querySelectorAll(".slide")];

function frags(i) { return [...slides[i].querySelectorAll(".f")]; }
function applyStep(i) {
  frags(i).forEach((el, k) => el.classList.toggle("on", k < STATE.step));
  const fill = slides[i].querySelector(".tl .fill");
  if (fill) fill.style.width = [4, 34, 64, 94][Math.min(STATE.step, 3)] + "%";
}
function show(i, atEnd) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  stopVoice();
  slides.forEach((el, k) => el.classList.toggle("active", k === i));
  STATE.i = i;
  STATE.step = atEnd ? frags(i).length : 0;
  applyStep(i);
  runEnter(i);
  document.getElementById("counter").textContent = (i + 1) + " / " + SLIDES.length;
  document.getElementById("prog").style.width = ((i + 1) / SLIDES.length * 100) + "%";
  document.getElementById("b-prev").disabled = i === 0 && STATE.step === 0;
  document.getElementById("b-next").disabled = i === SLIDES.length - 1 && STATE.step >= frags(i).length;
  notesText.textContent = SLIDES[i].notes;
  document.getElementById("notes-label").textContent = "Narration · slide " + (i + 1);
  try { history.replaceState(null, "", "#s" + (i + 1)); } catch (e) {}
  document.title = "Slide " + (i + 1) + " · Headache in SDEC";
}
function next() {
  if (STATE.step < frags(STATE.i).length) { STATE.step++; applyStep(STATE.i); document.getElementById("b-next").disabled = STATE.i === SLIDES.length - 1 && STATE.step >= frags(STATE.i).length; document.getElementById("b-prev").disabled = false; return; }
  if (STATE.i < SLIDES.length - 1) show(STATE.i + 1);
}
function prev() {
  if (STATE.step > 0) { STATE.step--; applyStep(STATE.i); document.getElementById("b-next").disabled = false; document.getElementById("b-prev").disabled = STATE.i === 0 && STATE.step === 0; return; }
  if (STATE.i > 0) show(STATE.i - 1, true);
}

/* Per-slide enter effects */
function runEnter(i) {
  const el = slides[i];
  el.querySelectorAll("[data-count]").forEach(n => {
    const target = parseFloat(n.dataset.count), dec = parseInt(n.dataset.dec || "0", 10), suffix = n.dataset.suffix || "";
    const reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    if (reduce) { n.textContent = target.toFixed(dec) + suffix; return; }
    const t0 = performance.now(), dur = 1400;
    const tick = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); n.textContent = (target * e).toFixed(dec) + suffix; if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
  const d = el.querySelector(".dots"); if (d) { const c = d.cloneNode(true); d.replaceWith(c); }
}

/* Scale the stage to the window */
function fit() {
  const box = document.getElementById("stage-box");
  const vp = box.parentElement;
  const w = vp.clientWidth - 8, h = vp.clientHeight - 16;
  const s = Math.max(0.2, Math.min(w / 1280, h / 720));
  box.style.width = (1280 * s) + "px"; box.style.height = (720 * s) + "px";
  stage.style.transform = "scale(" + s + ")";
}
window.addEventListener("resize", fit);

/* Notes and narration */
function toggleNotes(force) {
  const open = typeof force === "boolean" ? force : notesEl.hidden;
  notesEl.hidden = !open;
  document.getElementById("b-notes").setAttribute("aria-pressed", String(open));
  document.getElementById("b-notes").classList.toggle("on", open);
  fit();
}
const voiceBtn = document.getElementById("b-voice");
const synth = window.speechSynthesis;
let voice = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  voice = vs.find(v => /en[-_]GB/i.test(v.lang) && /female|Google UK English Female|Kate|Serena|Stephanie/i.test(v.name)) ||
          vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (synth) { pickVoice(); synth.addEventListener("voiceschanged", pickVoice); } else { voiceBtn.hidden = true; }
function stopVoice() {
  if (!synth) return;
  synth.cancel();
  voiceBtn.classList.remove("on"); voiceBtn.setAttribute("aria-pressed", "false"); voiceBtn.textContent = "Narrate";
  notesText.classList.remove("speaking");
}
function speak() {
  if (!synth) return;
  if (synth.speaking) { stopVoice(); return; }
  const u = new SpeechSynthesisUtterance(SLIDES[STATE.i].notes);
  u.lang = "en-GB"; u.rate = 0.98; u.pitch = 1;
  if (voice) u.voice = voice;
  u.onend = u.onerror = () => stopVoice();
  voiceBtn.classList.add("on"); voiceBtn.setAttribute("aria-pressed", "true"); voiceBtn.textContent = "Stop";
  notesText.classList.add("speaking");
  synth.speak(u);
}

/* Full screen */
function fullscreen() {
  const el = document.documentElement;
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  } catch (e) {}
}
document.addEventListener("fullscreenchange", () => setTimeout(fit, 50));

/* Controls */
document.getElementById("b-next").addEventListener("click", next);
document.getElementById("b-prev").addEventListener("click", prev);
document.getElementById("b-notes").addEventListener("click", () => toggleNotes());
voiceBtn.addEventListener("click", speak);
document.getElementById("b-full").addEventListener("click", fullscreen);
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  const k = e.key;
  if (k === "ArrowRight" || k === " " || k === "PageDown") { e.preventDefault(); next(); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); prev(); }
  else if (k === "Home") show(0);
  else if (k === "End") show(SLIDES.length - 1, true);
  else if (k === "n" || k === "N") toggleNotes();
  else if (k === "v" || k === "V") speak();
  else if (k === "f" || k === "F") fullscreen();
  else if (k === "Escape" && !notesEl.hidden) toggleNotes(false);
});
let tx = null;
stage.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) { if (dx < 0) next(); else prev(); }
}, { passive: true });

/* Interactions: flips, quizzes, hotspots, case */
stage.addEventListener("click", e => {
  const fl = e.target.closest(".flip");
  if (fl) { fl.classList.toggle("flipped"); return; }
  const ob = e.target.closest(".ob");
  if (!ob) return;
  const q = ob.closest(".q");
  if (q) {
    if (q.classList.contains("done")) return;
    const right = ob.dataset.pick === q.dataset.correct;
    q.classList.add("done", right ? "right" : "wrong");
    ob.classList.add("picked");
    if (!right) q.querySelectorAll(".ob").forEach(b => { if (b.dataset.pick === q.dataset.correct) b.classList.add("picked"); });
    return;
  }
  const st = ob.closest(".step");
  if (st) {
    if (st.classList.contains("done")) return;
    const right = ob.dataset.ok === "1";
    const fb = st.querySelector(".fb");
    fb.textContent = right ? fb.dataset.r : fb.dataset.w;
    st.classList.add("done", right ? "right" : "wrong");
    ob.classList.add("picked");
    if (!right) st.querySelectorAll(".ob").forEach(b => { if (b.dataset.ok === "1") b.classList.add("picked"); });
    const nxt = st.parentElement.querySelector('.step[data-i="' + (parseInt(st.dataset.i, 10) + 1) + '"]');
    if (nxt) nxt.hidden = false;
  }
});
stage.addEventListener("click", e => {
  const h = e.target.closest(".hot");
  if (!h) return;
  const s = SLIDES[STATE.i];
  const item = s.hots && s.hots[parseInt(h.dataset.hot, 10)];
  if (!item) return;
  const sl = h.closest(".slide");
  sl.querySelectorAll(".hot").forEach(b => b.classList.toggle("on", b === h));
  sl.querySelector(".hotpanel").innerHTML = "<h3>" + item[0] + "</h3><p>" + item[1] + "</p>";
});

/* Boot */
(function boot() {
  if (LINKS.pathway) {
    const p = document.getElementById("pathway-link");
    if (p) p.innerHTML = '<a href="' + esc(LINKS.pathway) + '">Open the QEHB SDEC headache pathway</a>. It has the doses, the contacts and the discharge checklist.';
    const b = document.getElementById("b-pathway");
    b.href = LINKS.pathway; b.hidden = false;
  }
  const m = (location.hash || "").match(/^#s(\d+)$/);
  show(m ? parseInt(m[1], 10) - 1 : 0);
  fit();
  setTimeout(fit, 300);
})();
</script>
